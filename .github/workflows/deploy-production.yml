name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: testing
          MYSQL_USER: testing
          MYSQL_PASSWORD: testing
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u testing -ptesting"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node deps
        run: npm ci

      - name: Install PHP deps
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Build assets
        run: npm run build

      - name: Prepare env
        run: |
          cp .env.example .env
          printf '\nDB_CONNECTION=mysql\nDB_HOST=127.0.0.1\nDB_PORT=3306\nDB_DATABASE=testing\nDB_USERNAME=testing\nDB_PASSWORD=testing\n' >> .env
          php artisan key:generate
          php artisan migrate --force

      - name: Diagnostic status
        run: |
          git status --short
          printf 'branch: '
          git branch --show-current

      - name: Run tests
        run: ./vendor/bin/phpunit

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-build
          path: public/build
          if-no-files-found: error

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: public-build
          path: public-build

      - name: Transfer build artifact over SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          source: public-build/*
          target: /home/u163968914/grahamotor-build-${{ github.run_id }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -eux
             repo=/home/u163968914/domains/cahayaarkana.site/public_html/grahamotor
             build=/home/u163968914/grahamotor-build-${{ github.run_id }}
             trap 'rm -rf "$build"' EXIT
             cd "$repo"
            test "$(git remote get-url origin)" = "https://github.com/leanderarya/grahamotor.git"
            git clean -fd public/build
            test -z "$(git status --porcelain --untracked-files=all)"
            test "$(git branch --show-current)" = "main"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
             rm -rf public/build
             mkdir -p public/build
             cp -a "$build"/public-build/. public/build/
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            php artisan migrate --force
            php artisan storage:link
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            php artisan about
